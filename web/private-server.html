<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RuneScape-style Client</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#080808;color:#eee;font:12px Arial,sans-serif;height:100%;overflow:hidden}
#client{width:1000px;height:650px;margin:12px auto;display:grid;grid-template-columns:760px 240px;grid-template-rows:520px 130px;background:#222;border:4px solid #111;box-shadow:0 0 0 2px #555}
#world{position:relative;background:#6d7d55;overflow:hidden;border-right:3px solid #111}
#scene{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
#hover{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.75);padding:5px 8px;border:1px solid #777;pointer-events:none}
#menu{position:absolute;display:none;background:#222;border:1px solid #aaa;min-width:150px;z-index:5;box-shadow:3px 3px 0 #111}
.menuItem{padding:5px 8px;cursor:pointer}.menuItem:hover{background:#444}
#side{background:#302b22;display:flex;flex-direction:column}
#panel{flex:1;padding:10px;background:linear-gradient(#40392e,#29251f);border-bottom:2px solid #111;overflow:auto}
#tabs{height:44px;display:grid;grid-template-columns:repeat(6,1fr);background:#171513}
.tab{border:1px solid #555;background:#302b25;color:#ddd;font-size:18px;cursor:pointer}.tab.active{background:#5b513f;box-shadow:inset 0 0 0 2px #111}
#bottom{grid-column:1/3;background:#302b22;border-top:3px solid #111;display:grid;grid-template-columns:230px 1fr 230px;align-items:center;padding:8px}
#chat{height:105px;background:#181818;border:2px solid #555;padding:6px;overflow:hidden;font-family:monospace}
#chat .system{color:#ffcc66}.hpbar{height:16px;background:#111;border:1px solid #aaa}.hpfill{height:100%;background:#b52d24}
.stat{display:flex;justify-content:space-between;border-bottom:1px solid #4d463a;padding:5px}
.inv{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.slot{height:48px;border:1px solid #777;background:#171717;display:flex;align-items:center;justify-content:center;font-size:10px;text-align:center;cursor:pointer}.slot:hover{border-color:#fff}
.small{color:#aaa}.section{font-weight:bold;border-bottom:1px solid #777;margin:0 0 7px;padding-bottom:4px}
#combat{background:#181818;border:2px solid #555;padding:8px}button{background:#302b25;color:#eee;border:1px solid #777;padding:5px}
</style>
</head>
<body>
<div id="client">
  <div id="world">
    <canvas id="scene" width="760" height="520"></canvas>
    <div id="hover">Walk here</div>
    <div id="menu"></div>
  </div>
  <aside id="side">
    <div id="panel"></div>
    <div id="tabs">
      <button class="tab active" data-tab="inventory" title="Inventory">🎒</button>
      <button class="tab" data-tab="equipment" title="Equipment">🛡</button>
      <button class="tab" data-tab="stats" title="Stats">📜</button>
      <button class="tab" data-tab="prayer" title="Prayer">✦</button>
      <button class="tab" data-tab="combat" title="Combat">⚔</button>
      <button class="tab" data-tab="settings" title="Settings">⚙</button>
    </div>
  </aside>
  <div id="bottom">
    <div id="combat"></div>
    <div id="chat"><div class="system">Welcome to the RuneScape-style prototype.</div><div>Left-click the ground to walk. Left-click an opponent to attack.</div></div>
    <div id="debug"></div>
  </div>
</div>
<script>
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');
const hover=document.getElementById('hover'),menu=document.getElementById('menu'),panel=document.getElementById('panel');
let state=null,activeTab='inventory',hoverTile=null;

function tileX(x){return 40+x*42}
function worldTile(px){return Math.max(0,Math.min(17,Math.round((px-40)/42)))}
function draw(s){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle='#6f7e59';ctx.fillRect(0,0,canvas.width,canvas.height);
 for(let x=0;x<18;x++){ctx.strokeStyle='rgba(30,40,20,.22)';ctx.beginPath();ctx.moveTo(tileX(x),0);ctx.lineTo(tileX(x),520);ctx.stroke()}
 for(let y=0;y<13;y++){ctx.beginPath();ctx.moveTo(0,y*42);ctx.lineTo(760,y*42);ctx.stroke()}
 const a=s.players.player,b=s.players.opponent;
 drawPlayer(a,'Player');drawPlayer(b,'Opponent');
}
function drawPlayer(p,label){
 const x=tileX(p.x),y=260;
 ctx.fillStyle=p.id==='player'?'#2859a5':'#a52d2d';ctx.fillRect(x-15,y-25,30,50);
 ctx.fillStyle='#111';ctx.fillRect(x-25,y-39,50,6);
 ctx.fillStyle='#c33';ctx.fillRect(x-24,y-38,48*Math.max(0,p.hp/p.maxHp),4);
 ctx.fillStyle='#fff';ctx.font='12px Arial';ctx.textAlign='center';ctx.fillText(label,x,y-47);
 if(p.targetId){ctx.strokeStyle='#ffff00';ctx.lineWidth=2;ctx.strokeRect(x-20,y-30,40,60)}
}
function send(c){return fetch('/input',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(c)})}
async function walk(tile){await send({type:'move',x:tile});}
async function attack(){await send({type:'attack',targetId:'opponent'});}
function say(t){document.getElementById('chat').insertAdjacentHTML('beforeend','<div>'+t+'</div>');document.getElementById('chat').scrollTop=99999}
canvas.addEventListener('mousemove',e=>{
 const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,tile=worldTile(x);hoverTile=tile;
 const p=state?.players?.opponent;const targetX=p?tileX(p.x):0;
 if(p&&Math.abs(x-targetX)<28&&Math.abs(e.clientY-260)<55){hover.textContent='Attack Opponent';canvas.style.cursor='pointer'}
 else {hover.textContent='Walk here';canvas.style.cursor='crosshair'}
});
canvas.addEventListener('mouseleave',()=>hover.textContent='');
canvas.addEventListener('click',async e=>{
 const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
 const p=state?.players?.opponent;
 if(p&&Math.abs(x-tileX(p.x))<28&&Math.abs(y-260)<55){await attack();say('You attack the opponent.');}
 else {await walk(worldTile(x));say('You walk here.');}
});
canvas.addEventListener('contextmenu',e=>{
 e.preventDefault();const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
 menu.innerHTML='';
 const add=(label,fn)=>{const d=document.createElement('div');d.className='menuItem';d.textContent=label;d.onclick=()=>{fn();menu.style.display='none'};menu.appendChild(d)};
 const p=state?.players?.opponent;
 if(p&&Math.abs(x-tileX(p.x))<35&&Math.abs(y-260)<65){add('Attack Opponent',attack);add('Walk here',()=>walk(worldTile(x)))}
 else {add('Walk here',()=>walk(worldTile(x)))}
 menu.style.left=x+'px';menu.style.top=y+'px';menu.style.display='block';
});
document.addEventListener('click',e=>{if(!menu.contains(e.target))menu.style.display='none'});

function renderPanel(){
 if(!state)return;
 const p=state.players.player;
 const inv=['Rune scimitar','Food x '+p.inventory.food,'Special energy '+p.inventory.specialEnergy+'%','Coins','Empty','Empty','Empty','Empty','Empty','Empty','Empty','Empty'];
 if(activeTab==='inventory') panel.innerHTML='<div class="section">Inventory</div><div class="inv">'+inv.map((x,i)=>'<div class="slot" data-i="'+i+'">'+x+'</div>').join('')+'</div><p class="small">Left-click an item to use it.</p>';
 if(activeTab==='equipment') panel.innerHTML='<div class="section">Worn equipment</div><div class="inv">'+['Weapon<br>'+p.equipment.weapon,'Head<br>Empty','Body<br>Empty','Legs<br>Empty','Cape<br>Empty','Shield<br>Empty','Amulet<br>Empty','Gloves<br>Empty','Boots<br>Empty','Ring<br>Empty','Ammo<br>Empty','Empty'].map(x=>'<div class="slot">'+x+'</div>').join('')+'</div>';
 if(activeTab==='stats') panel.innerHTML='<div class="section">Combat stats</div>'+[['Attack',p.attack],['Strength',p.strength],['Defence',p.defence],['Hitpoints',p.hp+'/'+p.maxHp]].map(x=>'<div class="stat"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('');
 if(activeTab==='prayer') panel.innerHTML='<div class="section">Prayer</div><div class="inv">'+['Protect melee','Protect mage','Protect range','Deactivate'].map((x,i)=>'<div class="slot" onclick="prayer('+i+')">'+x+'</div>').join('')+'</div>';
 if(activeTab==='combat') panel.innerHTML='<div class="section">Combat options</div><div id="combatbox">Rune scimitar<br>Attack speed: '+p.equipment.attackSpeed+' ticks<br>Attack bonus: +'+p.equipment.attackBonus+'<br>Strength bonus: +'+p.equipment.strengthBonus+'</div>';
 if(activeTab==='settings') panel.innerHTML='<div class="section">Settings</div><div class="stat"><span>Controls</span><b>Mouse</b></div><div class="stat"><span>Tick</span><b>'+state.tick+'</b></div><p class="small">This client intentionally uses mouse interaction rather than WASD/space controls.</p>';
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab));
}
async function prayer(i){await send({type:'prayer',prayer:i===0?'protect_melee':i===1?'protect_mage':i===2?'protect_range':null})}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;renderPanel()});
document.getElementById('combat').innerHTML='<b>Combat</b><br>Left-click a player/NPC to interact';
function render(s){state=s;draw(s);renderPanel();document.getElementById('debug').innerHTML='<div class="small">Tick '+s.tick+'</div><div class="hpbar"><div class="hpfill" style="width:'+(100*s.players.player.hp/s.players.player.maxHp)+'%"></div></div><div>HP '+s.players.player.hp+'/'+s.players.player.maxHp+'</div>'}
const stream=new EventSource('/events');stream.onmessage=e=>render(JSON.parse(e.data));stream.onerror=()=>{};
fetch('/state').then(r=>r.json()).then(render);
</script>
</body>
</html>
