<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RuneScape-style Client</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#080808;color:#eee;font:12px Arial,sans-serif;height:100%;overflow:hidden}
#client{width:1100px;height:690px;margin:8px auto;display:grid;grid-template-columns:820px 280px;grid-template-rows:555px 135px;background:#222;border:4px solid #111;box-shadow:0 0 0 2px #555}
#world{position:relative;background:#687653;overflow:hidden;border-right:3px solid #111}.scene{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
#hover{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.78);padding:5px 8px;border:1px solid #777;pointer-events:none}
#menu{position:absolute;display:none;background:#222;border:1px solid #aaa;min-width:165px;z-index:5;box-shadow:3px 3px 0 #111}.menuItem{padding:6px 9px;cursor:pointer}.menuItem:hover{background:#444}
#side{background:#302b22;display:flex;flex-direction:column}#panel{flex:1;padding:10px;background:linear-gradient(#40392e,#29251f);border-bottom:2px solid #111;overflow:auto}
#tabs{height:112px;display:grid;grid-template-columns:repeat(6,1fr);background:#171513}.tab{border:1px solid #555;background:#302b25;color:#ddd;font-size:17px;cursor:pointer}.tab.active{background:#5b513f;box-shadow:inset 0 0 0 2px #111}
#bottom{grid-column:1/3;background:#302b22;border-top:3px solid #111;display:grid;grid-template-columns:260px 1fr 260px;align-items:center;padding:8px}
#chat{height:116px;background:#181818;border:2px solid #555;padding:6px;overflow:hidden;font-family:monospace}.system{color:#ffcc66}
.section{font-weight:bold;border-bottom:1px solid #777;margin:0 0 7px;padding-bottom:4px}.small{color:#aaa}.stat{display:flex;justify-content:space-between;border-bottom:1px solid #4d463a;padding:5px}
.inv{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.slot{height:48px;border:1px solid #777;background:#171717;display:flex;align-items:center;justify-content:center;font-size:10px;text-align:center;cursor:pointer}.slot:hover{border-color:#fff}
.bar{height:14px;background:#111;border:1px solid #aaa;margin:4px 0}.fill{height:100%}.hp{background:#b52d24}.prayer{background:#4b73bb}.spec{background:#b28b25}
.style{display:grid;grid-template-columns:1fr 1fr;gap:4px}.style button{padding:7px;background:#171717;color:#ddd;border:1px solid #777}.style button.active{background:#5b513f}
</style></head><body>
<div id="client"><div id="world"><canvas id="scene" width="820" height="555"></canvas><div id="hover">Walk here</div><div id="menu"></div></div>
<aside id="side"><div id="panel"></div><div id="tabs">
<button class="tab active" data-tab="combat">⚔</button><button class="tab" data-tab="stats">☷</button><button class="tab" data-tab="quests">📜</button><button class="tab" data-tab="inventory">🎒</button><button class="tab" data-tab="equipment">🛡</button><button class="tab" data-tab="prayer">✦</button><button class="tab" data-tab="magic">✧</button><button class="tab" data-tab="social">♟</button><button class="tab" data-tab="settings">⚙</button><button class="tab" data-tab="emotes">☺</button><button class="tab" data-tab="music">♫</button>
</div></aside>
<div id="bottom"><div id="combatInfo"></div><div id="chat"><div class="system">Welcome to the RuneScape-style prototype.</div><div>Left-click ground to walk. Left-click a player/NPC to attack.</div><div>Right-click for context actions.</div></div><div id="debug"></div></div></div>
<script>
const canvas=document.getElementById("scene"),ctx=canvas.getContext("2d"),panel=document.getElementById("panel"),menu=document.getElementById("menu"),hover=document.getElementById("hover");
let state=null,activeTab="combat",hoverEntity=null;
const W=30,H=20,T=42,OX=20,OY=70;
function px(x){return OX+x*T}function py(y){return OY+y*T}function tileAt(x,y){return{x:Math.max(1,Math.min(W-2,Math.floor((x-OX)/T))),y:Math.max(1,Math.min(H-2,Math.floor((y-OY)/T)))}} 
function send(c){return fetch("/input",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(c)})}
function say(t){const chat=document.getElementById("chat");chat.insertAdjacentHTML("beforeend","<div>"+t+"</div>");chat.scrollTop=chat.scrollHeight}
function entityAt(x,y){if(!state)return null;for(const p of Object.values(state.players)){if(Math.abs(px(p.x)-x)<22&&Math.abs(py(p.y)-y)<28)return p}return null}
function draw(s){
 ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle="#687653";ctx.fillRect(0,0,canvas.width,canvas.height);
 for(let x=0;x<W;x++)for(let y=0;y<H;y++){ctx.strokeStyle=(x===0||y===0||x===W-1||y===H-1)?"rgba(20,20,20,.5)":"rgba(30,40,20,.18)";ctx.strokeRect(px(x),py(y),T,T)}
 ctx.fillStyle="rgba(70,65,50,.35)";ctx.fillRect(px(8),py(6),T*7,T);ctx.fillRect(px(18),py(13),T*6,T);
 for(const p of Object.values(s.players)){
  const x=px(p.x)+T/2,y=py(p.y)+T/2;ctx.fillStyle=p.id==="player"?"#2859a5":"#a52d2d";ctx.fillRect(x-14,y-20,28,40);
  ctx.fillStyle="#111";ctx.fillRect(x-24,y-34,48,6);ctx.fillStyle="#b52d24";ctx.fillRect(x-23,y-33,46*Math.max(0,p.hp/p.maxHp),4);
  ctx.fillStyle="#fff";ctx.font="12px Arial";ctx.textAlign="center";ctx.fillText(p.name,x,y-42);
  if(p.targetId) {ctx.strokeStyle="#ffff00";ctx.lineWidth=2;ctx.strokeRect(x-19,y-25,38,50)}
 }
}
canvas.addEventListener("mousemove",e=>{const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;hoverEntity=entityAt(x,y);hover.textContent=hoverEntity?("Attack "+hoverEntity.name):"Walk here";canvas.style.cursor=hoverEntity?"pointer":"crosshair"});
canvas.addEventListener("click",async e=>{const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(hoverEntity&&hoverEntity.id!=="player"){await send({type:"attack",targetId:hoverEntity.id});say("You attack "+hoverEntity.name+".")}else{const t=tileAt(x,y);await send({type:"move",x:t.x,y:t.y});say("You walk here.");}});
canvas.addEventListener("contextmenu",e=>{e.preventDefault();const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,p=entityAt(x,y);menu.innerHTML="";
 const add=(label,fn)=>{const d=document.createElement("div");d.className="menuItem";d.textContent=label;d.onclick=()=>{fn();menu.style.display="none"};menu.appendChild(d)};
 if(p&&p.id!=="player"){add("Attack "+p.name,()=>{send({type:"attack",targetId:p.id});say("Attack -> "+p.name)});add("Walk here",()=>{const t=tileAt(x,y);send({type:"move",x:t.x,y:t.y})}); } else {const t=tileAt(x,y);add("Walk here",()=>send({type:"move",x:t.x,y:t.y}));}
 menu.style.left=Math.min(x,canvas.width-180)+"px";menu.style.top=Math.min(y,canvas.height-100)+"px";menu.style.display="block";});
document.addEventListener("click",e=>{if(!menu.contains(e.target))menu.style.display="none"});
function prayer(i){send({type:"prayer",prayer:i===0?"protect_melee":i===1?"protect_mage":i===2?"protect_range":null})}
function style(s){send({type:"attack_style",style:s})}
function renderPanel(){if(!state)return;const p=state.players.player;
 if(activeTab==="combat")panel.innerHTML='<div class="section">Combat</div><div class="stat"><span>Rune scimitar</span><b>'+p.equipment.attackSpeed+' ticks</b></div><div class="style">'+["accurate","aggressive","defensive","controlled"].map(s=>'<button class="'+(p.attackStyle===s?"active":"")+'" onclick="style(\''+s+'\')">'+s+'</button>').join("")+'</div><div class="bar"><div class="fill spec" style="width:'+p.inventory.specialEnergy+'%"></div></div><button onclick="send({type:\'special\'})">Special attack</button><p class="small">Queued attacks resolve server-side on the 600ms game tick.</p>';
 if(activeTab==="inventory"){const items=(p.inventory?.slots||[]);panel.innerHTML='<div class="section">Inventory</div><div class="inv">'+items.map((v,i)=>'<div class="slot" data-slot="'+i+'">'+(v?(v.id==="rune_scimitar"?"Rune scimitar":v.id==="lobster"?"Lobster":"Coins")+" x "+v.quantity:"Empty")+"</div>").join("")+'</div>';panel.querySelectorAll(".slot").forEach(el=>el.onclick=()=>{const i=Number(el.dataset.slot);const v=items[i];if(v)send({type:"item_action",slot:i,action:v.id==="lobster"?"eat":"equip"});});}if(activeTab==="equipment")panel.innerHTML='<div class="section">Worn Equipment</div><div class="inv">'+["Weapon<br>Rune scimitar","Head<br>Empty","Body<br>Empty","Legs<br>Empty","Cape<br>Empty","Shield<br>Empty","Amulet<br>Empty","Gloves<br>Empty","Boots<br>Empty","Ring<br>Empty","Ammo<br>Empty","Empty"].map(x=>'<div class="slot">'+x+"</div>").join("")+"</div>";
 if(activeTab==="stats")panel.innerHTML='<div class="section">Combat Stats</div>'+[["Attack",p.attack],["Strength",p.strength],["Defence",p.defence],["Hitpoints",p.hp+"/"+p.maxHp],["Prayer",p.prayerPoints+"/"+p.maxPrayerPoints]].map(x=>'<div class="stat"><span>'+x[0]+"</span><b>"+x[1]+"</b></div>").join("");
 if(activeTab==="prayer")panel.innerHTML='<div class="section">Prayer</div><div class="bar"><div class="fill prayer" style="width:'+(100*p.prayerPoints/p.maxPrayerPoints)+'%"></div></div><div class="inv">'+["Protect melee","Protect mage","Protect range","Deactivate"].map((x,i)=>'<div class="slot" onclick="prayer('+i+')">'+x+"</div>").join("")+"</div>";
 if(activeTab==="quests")panel.innerHTML='<div class="section">Quest List</div><p class="small">Quest and dialogue content will be driven by RuneScript.</p>';
 if(activeTab==="magic")panel.innerHTML='<div class="section">Magic</div><p class="small">Spellbook scaffold.</p>';
 if(activeTab==="social")panel.innerHTML='<div class="section">Social</div><div class="stat"><span>Friends</span><b>0</b></div><div class="stat"><span>Clan</span><b>None</b></div>';
 if(activeTab==="settings")panel.innerHTML='<div class="section">Settings</div><div class="stat"><span>Input</span><b>Mouse</b></div><div class="stat"><span>Server tick</span><b>'+state.tick+"</b></div>";
 if(activeTab==="emotes")panel.innerHTML='<div class="section">Emotes</div><div class="inv">'+["Wave","Yes","No","Laugh","Cheer","Dance"].map(x=>'<div class="slot">'+x+"</div>").join("")+"</div>";
 if(activeTab==="music")panel.innerHTML='<div class="section">Music</div><p class="small">Music interface scaffold.</p>';
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===activeTab));
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;renderPanel()});
function render(s){state=s;draw(s);renderPanel();const p=s.players.player;document.getElementById("combatInfo").innerHTML='<b>'+p.name+"</b><div>HP "+p.hp+"/"+p.maxHp+'</div><div class="bar"><div class="fill hp" style="width:'+(100*p.hp/p.maxHp)+'%"></div></div><div>Prayer "+p.prayerPoints+"/"+p.maxPrayerPoints+"</div><div class="bar"><div class="fill prayer" style="width:"+(100*p.prayerPoints/p.maxPrayerPoints)+"%"></div></div>";document.getElementById("debug").innerHTML='<div class="small">Tick '+s.tick+'</div><div class="small">Position '+p.x+", "+p.y+"</div><div class="small">Target "+(p.targetId||"none")+"</div>"}
const stream=new EventSource("/events");stream.onmessage=e=>render(JSON.parse(e.data));fetch("/state").then(r=>r.json()).then(render);
</script></body></html>
